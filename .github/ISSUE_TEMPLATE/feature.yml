name: 功能建议
description: 提议新功能或改进现有流程
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景和遇到的问题
      description: 你正在做什么？现有流程哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望看到的改进
      description: 请描述期望的使用方式，也可以补充你考虑过的方案。
    validations:
      required: true
