name: 问题反馈
description: 报告安装、微信收发、截图核验或其他功能异常
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issues。这个表单是公开的，请删除 API Key、Bearer Token、微信私聊内容及其他个人信息。
        安全漏洞请通过 [私密渠道](https://github.com/deadlineiscoming/x-validator/security/advisories/new) 报告。
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请说明操作顺序，尽量提供脱敏截图或公开原帖链接。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际结果与预期结果
      description: 请附上可公开的错误消息。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请填写项目版本或提交号、Windows 版本，以及与问题相关的 Python、Node.js 或 PowerShell 版本。
    validations:
      required: true
